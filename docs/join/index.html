<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Einladung zu Barte</title>
<style>
  :root { color-scheme: light dark; --bg: #f2f2f7; --card: #fff; --ink: #000; --ink2: #3c3c4399; --accent: #007aff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --ink: #fff; --ink2: #ebebf599; --accent: #0a84ff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { width: min(100% - 32px, 420px); text-align: center; padding: 40px 0; }
  .logo { width: 96px; height: 96px; border-radius: 22px; margin: 0 auto 20px;
          background: linear-gradient(135deg, #007aff, #5856d6); box-shadow: 0 12px 24px #5856d64d; display: grid; place-items: center; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p { color: var(--ink2); margin: 0 0 24px; }
  .code { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 20px;
          font: 700 30px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; }
  a.button { display: block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
             border-radius: 999px; padding: 15px 20px; margin-bottom: 12px; }
  small { color: var(--ink2); display: block; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">
    <svg width="56" height="40" viewBox="0 0 56 40"><path d="M2 6a6 6 0 0 1 6-6h22L18 40H8a6 6 0 0 1-6-6z" fill="#fff"/><path d="M34 0h14a6 6 0 0 1 6 6v28a6 6 0 0 1-6 6H22z" fill="#fff" opacity=".85"/></svg>
  </div>
  <h1 data-en="You’re invited">Du bist eingeladen</h1>
  <p data-en="Someone wants to share expenses with you in Barte.">Jemand möchte Ausgaben mit dir in Barte teilen.</p>
  <div class="code" id="code" aria-label="Einladungscode" data-en-label="Invite code">–</div>
  <a class="button" id="open" href="barte://join/" data-en="Open in Barte">In Barte öffnen</a>
  <small data-en="No Barte yet? Install the app, open it and tap “Join with Code”.">Noch kein Barte? Installiere die App, öffne sie und tippe auf „Mit Code beitreten“.</small>
</main>
<script>
  // German by default, English for English browsers, like the app.
  if (/^en\b/i.test(navigator.language || "")) {
    document.documentElement.lang = "en";
    document.title = "Invitation to Barte";
    for (const el of document.querySelectorAll("[data-en]")) el.textContent = el.dataset.en;
    for (const el of document.querySelectorAll("[data-en-label]")) el.setAttribute("aria-label", el.dataset.enLabel);
  }
  const raw = new URLSearchParams(location.search).get("c") || "";
  const code = raw.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 12);
  if (code) {
    document.getElementById("code").textContent = code.length === 8 ? code.slice(0, 4) + " " + code.slice(4) : code;
    document.getElementById("open").href = "barte://join/" + code;
  }
</script>
</body>
</html>
