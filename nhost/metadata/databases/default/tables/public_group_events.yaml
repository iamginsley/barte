# Append-only history (see the group_events migration). Readable by everyone in the group,
# writable by nobody: rows only come from the database triggers.
table:
  name: group_events
  schema: public
object_relationships:
  - name: group
    using:
      foreign_key_constraint_on: group_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - group_id
        - kind
        - actor_id
        - actor_name
        - subject_id
        - old
        - new
        - created_at
      filter:
        group:
          members:
            user_id:
              _eq: X-Hasura-User-Id
event_triggers:
  # Push notifications come from the history, not from the app, so an edit can't skip them.
  - name: group_event_notify
    definition:
      enable_manual: false
      insert:
        columns: "*"
    retry_conf:
      interval_sec: 10
      num_retries: 0
      timeout_sec: 60
    webhook: "{{NHOST_FUNCTIONS_URL}}/events/group-event"
    headers:
      - name: nhost-webhook-secret
        value_from_env: NHOST_WEBHOOK_SECRET
