table:
  name: members
  schema: public
object_relationships:
  - name: group
    using:
      foreign_key_constraint_on: group_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - group_id
        - name
        - user_id
        - created_at
      filter:
        group:
          members:
            user_id:
              _eq: X-Hasura-User-Id
