table:
  name: expenses
  schema: public
object_relationships:
  - name: group
    using:
      foreign_key_constraint_on: group_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - group_id
        - title
        - amount_cents
        - spent_on
        - payer_id
        - participant_ids
        - is_settlement
        - split_kind
        - split_values
        - created_by
        - created_at
        - updated_at
      filter:
        group:
          members:
            user_id:
              _eq: X-Hasura-User-Id
